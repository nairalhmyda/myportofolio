{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ name }} - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <header class="site-header">

        <a href="{% url 'main:show_main' %}" class="brand">
            Naira Al Humayda
        </a>

        <button
            type="button"
            class="menu-toggle"
            id="menu-toggle"
            aria-expanded="false"
            aria-controls="site-menu"
        >
            MENU
            <span class="menu-icon">+</span>
        </button>

    </header>

    <nav class="site-menu" id="site-menu">
        <a href="{% url 'main:show_main' %}">Profile</a>
        <a href="{% url 'main:show_experience' %}">Experience</a>
        <a href="{% url 'main:show_projects' %}">Projects</a>
        {% if user.is_authenticated %}
            <span class="nav-user">{{ user.username }}</span>
            <a href="{% url 'main:logout' %}">Logout</a>
        {% else %}
            <a href="{% url 'main:login' %}">Login</a>
            <a href="{% url 'main:register' %}">Register</a>
        {% endif %}
    </nav>

    <script>
        const menuToggle = document.querySelector(".menu-toggle");
        const siteMenu = document.querySelector("#site-menu");

        menuToggle.addEventListener("click", () => {
            const isOpen = siteMenu.classList.toggle("is-open");

            menuToggle.setAttribute("aria-expanded", isOpen);
            menuToggle.querySelector("span:first-child").textContent =
                isOpen ? "CLOSE" : "MENU";
            menuToggle.querySelector(".menu-icon").textContent =
                isOpen ? "×" : "+";
        });
    </script>

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <p>
            © 2026 {{ name }}.
            Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
    </footer>
</body>
</html>
